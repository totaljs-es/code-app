name: Release

# A version tag (v1.0.0, the version of package.json) builds the app for Windows and Linux (x64 and ARM64) and publishes them in a GitHub
# release with their SHA-256. Nothing is built on a personal machine: the release is the build of this tag.
# Windows is not signed yet (see README.md, Code signing).
# Run by hand from the Actions tab (or gh workflow run release.yml), it builds everything and keeps the files as artifacts
# of the run, without publishing a release: a way to try the build before tagging.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The tag is the version of package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::The tag $GITHUB_REF_NAME is not v$version (package.json)"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the libraries of the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The files keep the same names in every release, so that releases/latest/download/<file> always gives the latest one.
  windows:
    needs: check
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Name the installers
        shell: bash
        run: |
          mkdir out
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          cp $bundle/nsis/*.exe "out/TotalJSCode-windows-${{ matrix.arch }}-setup.exe"
          if [ -d $bundle/msi ]; then cp $bundle/msi/*.msi "out/TotalJSCode-windows-${{ matrix.arch }}.msi"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: out/*

  linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            deb: amd64
            rpm: x86_64
          - runner: ubuntu-22.04-arm
            deb: arm64
            rpm: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the libraries of the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
      - name: Name the packages
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb "out/TotalJSCode-linux-${{ matrix.deb }}.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "out/TotalJSCode-linux-${{ matrix.rpm }}.rpm"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/TotalJSCode-linux-${{ matrix.rpm }}.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.deb }}
          path: out/*

  release:
    if: github.ref_type == 'tag'
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: SHA-256 of every file
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notes of the release
        run: |
          {
            echo "Total.js Code ${{ needs.check.outputs.version }} for Windows and Linux. It opens your Total.js Code instances, each in a window of its own, with the local copy of files."
            echo
            echo "**Windows:** the installer is not signed yet. The first time, Windows SmartScreen says it protected your PC: choose **More info → Run anyway**."
            echo
            echo "SHA-256 of each file:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Total.js Code ${{ needs.check.outputs.version }}" --notes-file notes.md --verify-tag
