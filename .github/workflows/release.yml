name: Release

# A version tag (v1.0.0, the version of package.json) builds the app for Windows and Linux and publishes them in a GitHub
# release with their SHA-256. Nothing is built on a personal machine: the release is the build of this tag.
# Windows is not signed yet (see README.md, Code signing).
# Run by hand from the Actions tab (or gh workflow run release.yml), it builds everything and keeps the files as artifacts
# of the run, without publishing a release: a way to try the build before tagging.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The tag is the version of package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::The tag $GITHUB_REF_NAME is not v$version (package.json)"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the libraries of the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis,msi
      - name: Name the installers after the version
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/TotalJSCode-${{ needs.check.outputs.version }}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "out/TotalJSCode-${{ needs.check.outputs.version }}-windows-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the libraries of the web view
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
      - name: Name the packages after the version
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb "out/TotalJSCode-${{ needs.check.outputs.version }}-linux-amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "out/TotalJSCode-${{ needs.check.outputs.version }}-linux-x86_64.rpm"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/TotalJSCode-${{ needs.check.outputs.version }}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  release:
    if: github.ref_type == 'tag'
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: SHA-256 of every file
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notes of the release
        run: |
          {
            echo "Total.js Code ${{ needs.check.outputs.version }} for Windows and Linux. It opens your Total.js Code instances, each in a window of its own, with the local copy of files."
            echo
            echo "**Windows:** the installer is not signed yet. The first time, Windows SmartScreen says it protected your PC: choose **More info → Run anyway**."
            echo
            echo "SHA-256 of each file:"
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Total.js Code ${{ needs.check.outputs.version }}" --notes-file notes.md --verify-tag
