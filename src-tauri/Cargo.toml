[package]
name = "code-app"
version = "1.0.0"
description = "Total.js Code: your Code instances in an app of their own"
authors = ["Spanish Total.js Platform"]
license = "MIT"
repository = "https://github.com/totaljs-es/code-app"
edition = "2024"

[lib]
name = "code_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
